name: Lean VN-Quant Execution Engine & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Scientific & Quant Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Ephemeral Quant Directories
        run: |
          mkdir -p data fingraph/data

      - name: Step 1 - Zero-Leak Secret & Security Audit
        run: |
          python scripts/security_scan.py

      - name: Step 2 - Execute Hermetic Pytest Verification Suite
        run: |
          python -m pytest tests/ -v
