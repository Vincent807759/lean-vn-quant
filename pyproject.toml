[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-vn-quant"
version = "2.0.0"
description = "Systematic quantitative execution and microstructure engine for Vietnam Equities (VN30)"
readme = "README.md"
authors = [
    { name = "Vincent Cao", email = "vincentcao706@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "quantitative-finance",
    "vietnam-stock-market",
    "vn30",
    "microstructure",
    "systematic-trading",
    "numba",
    "polars"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.11.4",
    "numba==0.59.1",
    "bottleneck==1.3.7",
    "polars==0.20.31",
    "pyarrow==15.0.2",
    "duckdb==0.10.3",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
]

[project.urls]
Homepage = "https://github.com/Vincent807759/lean-vn-quant"
Repository = "https://github.com/Vincent807759/lean-vn-quant"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "services*", "fingraph*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
